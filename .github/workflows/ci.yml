name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specflow-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: specflow-backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specflow-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: specflow-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            specflow-backend/package-lock.json
            specflow-frontend/package-lock.json
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: Run e2e smoke
        run: bash scripts/e2e-ci.sh
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/specflow-e2e
